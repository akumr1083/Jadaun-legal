<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nav check</title>
<style>
  body { margin: 0; background: #111; }
  .row { display: flex; gap: 10px; padding: 8px; align-items: flex-start; }
  .cell { flex: none; outline: 1px solid #444; }
  iframe { display: block; border: 0; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  const widths = [1440, 1200, 1181, 1180, 1100, 1024, 985, 905, 900];
  const row = document.getElementById("row");
  for (const w of widths) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const f = document.createElement("iframe");
    f.width = w; f.height = 900; f.dataset.w = w;
    f.src = "index.html?only=1";
    cell.appendChild(f); row.appendChild(cell);
  }
  window.__nav = () => [...document.querySelectorAll("iframe")].map((f) => {
    const d = f.contentDocument, w = f.contentWindow;
    const links = [...d.querySelectorAll(".nav__links a")];
    const brand = d.querySelector(".brand");
    const cta = d.querySelector(".nav .btn");
    const visible = getComputedStyle(d.querySelector(".nav__links")).display !== "none";
    const overlap = visible && brand && cta && links.length
      ? (brand.getBoundingClientRect().right > links[0].getBoundingClientRect().x - 4 ||
         links[links.length - 1].getBoundingClientRect().right > cta.getBoundingClientRect().left - 4)
      : false;
    const footCols = [...d.querySelectorAll(".footer__cols > div")].map(el => {
      const r = el.getBoundingClientRect();
      return { x: Math.round(r.x), w: Math.round(r.width), y: Math.round(r.y) };
    });
    return {
      width: Number(f.dataset.w),
      linksVisible: visible,
      linkCount: links.length,
      overlap,
      brandRight: brand ? Math.round(brand.getBoundingClientRect().right) : null,
      firstLinkLeft: links.length ? Math.round(links[0].getBoundingClientRect().x) : null,
      lastLinkRight: links.length ? Math.round(links[links.length - 1].getBoundingClientRect().right) : null,
      ctaLeft: cta && getComputedStyle(cta).display !== "none" ? Math.round(cta.getBoundingClientRect().left) : null,
      overflowX: d.documentElement.scrollWidth > w.innerWidth + 1,
      footCols,
      careersFooter: !!d.querySelector('.footer a[href="careers.html"]'),
      disclaimerFooter: !!d.querySelector('.footer a[href="disclaimer.html"]')
    };
  });
</script>
</body>
</html>
