<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>subpage check</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 12px/1.4 monospace; }
  .row { display: flex; gap: 10px; padding: 8px; align-items: flex-start; }
  .cell { flex: none; outline: 1px solid #444; }
  iframe { display: block; border: 0; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  const widths = [1440, 1180, 1100, 985, 905, 900, 700, 620, 390];
  const pages = ["careers.html", "disclaimer.html"];
  const row = document.getElementById("row");

  for (const page of pages) {
    for (const w of widths) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const f = document.createElement("iframe");
      f.width = w;
      f.height = 900;
      f.dataset.w = w;
      f.dataset.page = page;
      f.src = page + "?only=1";
      cell.appendChild(f);
      row.appendChild(cell);
    }
  }

  window.__measure = () => {
    return [...document.querySelectorAll("iframe")].map((f) => {
      const d = f.contentDocument, w = f.contentWindow;
      d.querySelectorAll(".reveal").forEach((el) => el.classList.add("in"));
      const q = (s) => d.querySelector(s);
      const rect = (el) => {
        if (!el) return null;
        const r = el.getBoundingClientRect();
        return [Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height)];
      };
      const links = [...d.querySelectorAll(".nav__links a")];
      const brand = q(".brand");
      const cta = q(".nav .btn");
      const navOverlap = Boolean(
        brand && links.length && cta &&
        (brand.getBoundingClientRect().right > links[0].getBoundingClientRect().x - 4 ||
         links[links.length - 1].getBoundingClientRect().right > cta.getBoundingClientRect().left - 4)
      );
      const grid = q(".legal__grid") || q(".careers__grid");
      const tracks = q(".tracks");
      const apply = q(".apply");
      return {
        page: f.dataset.page,
        width: Number(f.dataset.w),
        navLinksVisible: links.filter(a => getComputedStyle(a).display !== "none").length,
        navOverlap,
        overflowX: d.documentElement.scrollWidth > w.innerWidth + 1,
        pageheadTitle: rect(q(".pagehead__title")),
        gridCols: grid ? getComputedStyle(grid).gridTemplateColumns : null,
        trackCols: tracks ? getComputedStyle(tracks).gridTemplateColumns : null,
        applyCols: apply ? getComputedStyle(apply).gridTemplateColumns : null,
        tocPos: q(".legal__toc") ? getComputedStyle(q(".legal__toc")).position : null,
        docH: d.documentElement.scrollHeight,
        imgsOk: [...d.images].every(i => i.complete && i.naturalWidth > 0)
      };
    });
  };
</script>
</body>
</html>
